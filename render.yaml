# Optional blueprint for Render. Creating the service by hand from the
# dashboard works exactly the same way, see the deployment section of README.md.
services:
  - type: web
    name: ajaia-docs
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/auth/demo-users
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
