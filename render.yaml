# Optional blueprint for Render. This project deploys to Railway with a Supabase
# database, see the deployment section of README.md for those steps. This file is
# kept because the same four environment variables apply to any host, and Render
# is a one click alternative.
services:
  - type: web
    name: ajaia-docs
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/auth/demo-users
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
